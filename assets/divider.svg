<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24" role="img" aria-labelledby="t">
<title id="t">Section divider</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A17"/><stop offset=".55" stop-color="#0A1230"/><stop offset="1" stop-color="#140F33"/></linearGradient>
<linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
<linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".3" stop-color="#22D3EE" stop-opacity=".7"/><stop offset=".7" stop-color="#8B5CF6" stop-opacity=".7"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
</defs>
<rect x="0" y="11" width="1200" height="2" fill="url(#ln)"/>
<rect x="565" y="7" width="10" height="10" transform="rotate(45 570 12)" fill="#0B1124" stroke="#22D3EE" stroke-width="1.6"/>
<rect x="593" y="5" width="14" height="14" transform="rotate(45 600 12)" fill="#0B1124" stroke="#3B82F6" stroke-width="1.6"/>
<rect x="625" y="7" width="10" height="10" transform="rotate(45 630 12)" fill="#0B1124" stroke="#8B5CF6" stroke-width="1.6"/>
<circle r="3" fill="#22D3EE" filter="url(#glow)"><animateMotion path="M120,12 H1080" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.9;1" dur="6s" repeatCount="indefinite"/></circle>
</svg>
